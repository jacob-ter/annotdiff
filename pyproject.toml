[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jacob-ter-annotdiff"
version = "0.1.0"
description = "按样本比对两批标注，列出分歧点、一致率与分歧最集中的类别。"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "jacob-ter" }]
keywords = ["annotation", "agreement", "quality", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://jacob-ter.github.io"
Repository = "https://github.com/jacob-ter/annotdiff"
Issues = "https://github.com/jacob-ter/annotdiff/issues"

[project.scripts]
annotdiff = "annotdiff:main"

[tool.setuptools]
py-modules = ["annotdiff"]
